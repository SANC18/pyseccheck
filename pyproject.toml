[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyseccheck"
version = "0.1.0"
description = "A Python security linter — catches what Bandit misses via AST analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pyseccheck = "pyseccheck.cli:main"

[project.urls]
Homepage = "https://github.com/SANC18/pyseccheck"
"Bug Tracker" = "https://github.com/SANC18/pyseccheck/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyseccheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
